# Dr. Vibe's own commands any of its windows may call (capabilities/default.json).
# Commands that reach the network as the linked device, edit another tool's
# files, run an AI CLI or delete data are left out: each has its own
# capability listing only the windows that use it (capabilities/*.json).
# tests/unit/commandAcl.test.js keeps this, build.rs and main.rs in step.

[[set]]
identifier = "everyday"
description = "Dr. Vibe commands every window may call."
permissions = [
  "allow-get-active-window",
  "allow-is-coding-app",
  "allow-get-cursor-position",
  "allow-last-input-age-ms",
  "allow-scan-project-markers",
  "allow-resolve-repo",
  "allow-find-folder-repos",
  "allow-untracked-places",
  "allow-start-watching",
  "allow-stop-watching",
  "allow-get-watched-path",
  "allow-list-skins",
  "allow-read-skin",
  "allow-read-skin-anim",
  "allow-read-skin-vibe-id",
  "allow-save-skin",
  "allow-delete-skin",
  "allow-copy-skin",
  "allow-set-skin-source",
  "allow-rename-skin",
  "allow-quit-app",
  "allow-restart-app",
  "allow-get-web-base-url",
  "allow-set-tray-tooltip",
  "allow-set-tray-paused",
  "allow-set-main-window-size",
  "allow-open-settings-window",
  "allow-open-dashboard-window",
  "allow-open-sprite-editor",
  "allow-open-character-workshop",
  "allow-open-panel-window",
  "allow-read-claude-code-events",
  "allow-check-claude-code-hooks",
  "allow-claude-code-present",
  "allow-check-claude-installed",
  "allow-check-codex-installed",
  "allow-check-for-updates",
  "allow-check-whats-new",
  "allow-dismiss-whats-new",
  "allow-get-git-info",
  "allow-cache-companion-skin",
  "allow-update-companions-tray",
  "allow-import-skin",
  "allow-export-skin",
  "allow-save-sprite-template",
  "allow-get-profile",
  "allow-update-profile",
  "allow-get-presenting-state",
  "allow-cache-visitor-sprite",
  "allow-set-visitor-frame",
  "allow-create-toast-window",
  "allow-get-monitor-work-areas",
  "allow-pick-folder",
  "allow-error-report",
  "allow-error-reports-get-enabled",
  "allow-error-reports-queue",
]
