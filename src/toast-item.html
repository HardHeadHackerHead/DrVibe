<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('drvibe-theme') || 'dark');</script>
  <link rel="stylesheet" href="styles/overlay.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: transparent;
      overflow: hidden;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Colours come from tokens.css, so toasts follow the light/dark theme. */
    .toast {
      --t-bg: color-mix(in srgb, var(--surface) 96%, transparent);
      --t-edge: var(--border);
      --t-chip: color-mix(in srgb, var(--text) 8%, transparent);
      --t-chip-hover: color-mix(in srgb, var(--text) 15%, transparent);
      --t-faint: color-mix(in srgb, var(--text) 30%, transparent);
      position: relative;
      overflow: hidden;
      background: var(--t-bg);
      border: 2px solid var(--t-edge);
      border-left: 4px solid var(--accent, var(--lab-green));
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow:
        var(--shadow-lift),
        0 0 20px var(--glow, transparent);
      animation: toastSlideIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      backdrop-filter: blur(16px);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: grab;
    }

    .toast.dragging { cursor: grabbing; transition: none !important; will-change: transform, opacity; }

    .toast:hover {
      transform: translateX(-4px);
      box-shadow:
        var(--shadow-lift),
        0 0 30px var(--glow, transparent);
    }

    .toast.exit { animation: toastSlideOut 0.25s cubic-bezier(0.4, 0, 1, 1) forwards; }

    .toast-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .toast-icon { font-size: 20px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .toast-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; letter-spacing: 0.01em; flex: 1; }

    .toast-close {
      width: 20px; height: 20px; border: none;
      background: var(--t-chip); border-radius: 6px;
      color: var(--muted); font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease; flex-shrink: 0;
    }
    .toast-close:hover { background: var(--t-chip-hover); color: var(--text); }

    .toast-body { font-size: 12px; color: var(--text-soft); line-height: 1.5; padding-left: 30px; }

    .toast-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-left: 30px; }
    .toast-brand { font-size: 9px; font-weight: 600; color: var(--t-faint); text-transform: uppercase; letter-spacing: 1.5px; }

    .toast-actions { display: flex; gap: 6px; align-items: center; }

    .toast-snooze-btn, .toast-view-btn {
      font-size: 10px; font-weight: 600;
      background: var(--t-chip); border: 1px solid var(--t-edge);
      border-radius: 6px; padding: 3px 8px; cursor: pointer;
      letter-spacing: 0.5px; text-transform: uppercase; transition: all 0.15s ease;
    }
    .toast-snooze-btn { color: var(--text-soft); }
    .toast-snooze-btn:hover { background: var(--t-chip-hover); color: var(--text); border-color: var(--border-strong); }
    .toast-view-btn { color: var(--accent, var(--lab-green)); border-color: color-mix(in srgb, var(--accent, var(--lab-green)) 35%, transparent); }
    .toast-view-btn:hover { background: color-mix(in srgb, var(--accent, var(--lab-green)) 15%, transparent); border-color: color-mix(in srgb, var(--accent, var(--lab-green)) 55%, transparent); }

    .toast-progress-container { position: absolute; bottom: 0; left: 4px; right: 0; height: 3px; background: var(--t-chip); border-radius: 0 0 12px 0; overflow: hidden; }
    .toast-progress { height: 100%; background: var(--accent, var(--lab-green)); border-radius: 0 0 12px 0; transform-origin: left; animation: progressShrink var(--duration) linear forwards; }

    .toast.cat-default     { --accent: var(--lab-green); --glow: color-mix(in srgb, var(--lab-green) 15%, transparent); }
    .toast.cat-break       { --accent: #60a5fa; --accent-light: #93c5fd; --glow: rgba(96, 165, 250, 0.15); }
    .toast.cat-hydration   { --accent: #38bdf8; --accent-light: #7dd3fc; --glow: rgba(56, 189, 248, 0.15); }
    .toast.cat-posture     { --accent: #a78bfa; --accent-light: #c4b5fd; --glow: rgba(167, 139, 250, 0.15); }
    .toast.cat-eyestrain   { --accent: #f472b6; --accent-light: #f9a8d4; --glow: rgba(244, 114, 182, 0.15); }
    .toast.cat-fatigue     { --accent: #fbbf24; --accent-light: #fcd34d; --glow: rgba(251, 191, 36, 0.15); }
    .toast.cat-stuck       { --accent: #fb923c; --accent-light: #fdba74; --glow: rgba(251, 146, 60, 0.15); }
    .toast.cat-overwork    { --accent: #ef4444; --accent-light: #f87171; --glow: rgba(239, 68, 68, 0.15); }
    .toast.cat-achievement { --accent: #facc15; --accent-light: #fde047; --glow: rgba(250, 204, 21, 0.2); }
    .toast.cat-boundary    { --accent: #34d399; --accent-light: #6ee7b7; --glow: rgba(52, 211, 153, 0.15); }
    .toast.cat-work        { --accent: #818cf8; --accent-light: #a5b4fc; --glow: rgba(129, 140, 248, 0.15); }
    .toast.cat-trade       { --accent: #f59e0b; --accent-light: #fcd34d; --glow: rgba(245, 158, 11, 0.15); }
    .toast.cat-community   { --accent: var(--spark-violet); --glow: color-mix(in srgb, var(--spark-violet) 15%, transparent); }
    .toast.cat-economy     { --accent: var(--lab-green); --glow: color-mix(in srgb, var(--lab-green) 15%, transparent); }

    .toast.cat-achievement {
      background: color-mix(in srgb, var(--streak) 8%, var(--t-bg));
      border-color: color-mix(in srgb, var(--streak) 35%, transparent);
      border-left-color: var(--streak);
    }
    .toast.cat-achievement .toast-icon { animation: achievementPulse 2s ease-in-out infinite; }

    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateX(40px) scale(0.92); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes toastSlideOut {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to   { opacity: 0; transform: translateX(40px) scale(0.92); }
    }
    @keyframes progressShrink {
      from { transform: scaleX(1); }
      to   { transform: scaleX(0); }
    }
    @keyframes achievementPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <script type="module" src="toast-item.js"></script>
</body>
</html>
