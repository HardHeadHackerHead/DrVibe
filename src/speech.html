<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Vibe Speech</title>
  <link rel="icon" href="data:,">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('drvibe-theme') || 'dark');</script>
  <link rel="stylesheet" href="styles/overlay.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #speech-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      height: 100%;
      padding-bottom: 0;
    }

    /* Colours come from tokens.css, so the bubble follows the light/dark theme. */
    #speech-bubble {
      --bubble-bg: color-mix(in srgb, var(--surface) 92%, transparent);
      position: relative;
      background: var(--bubble-bg);
      backdrop-filter: blur(12px) saturate(1.4);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      border: 2px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 170px;
      text-align: center;
      box-shadow: var(--shadow-lift);
      animation: bubbleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #speech-bubble.hidden {
      display: none;
    }

    /* Arrow pointing down toward Dr. Vibe */
    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 6px solid var(--bubble-bg);
    }

    #speech-bubble-text {
      display: block;
      font-size: 11px;
      color: var(--green-text);
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    #speech-bubble-tip {
      display: block;
      font-size: 9px;
      color: var(--text-soft);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    #speech-bubble-dismiss {
      padding: 3px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      background: var(--surface-2);
      color: var(--text);
      transition: background 0.2s;
    }

    #speech-bubble-dismiss:hover {
      background: var(--border-strong);
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div id="speech-container">
    <div id="speech-bubble" class="hidden">
      <span id="speech-bubble-text"></span>
      <span id="speech-bubble-tip"></span>
      <button id="speech-bubble-dismiss">Got it!</button>
    </div>
  </div>

  <script type="module" src="speech-bubble.js"></script>
</body>
</html>
