<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Wins</title>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('drvibe-theme') || 'dark');</script>
  <link rel="stylesheet" href="styles/panel.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }


    html, body {
      width: 100%; height: 100%;
      background: var(--bg-main);
      font-family: var(--font-body);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
      overflow-y: auto;
      overflow-x: hidden;
      transition: background .2s, color .2s;
    }

    body::-webkit-scrollbar { width: 4px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .wins-wrap {
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Header ── */
    .wins-header {
      text-align: center;
      margin-bottom: 14px;
    }

    .wins-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.01em;
      line-height: 1.2;
      margin-bottom: 5px;
    }

    .today-wins-message {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      font-style: italic;
    }

    /* ── Stats row ── */
    .today-wins-stats {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .today-wins-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 9px 14px;
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      min-width: 64px;
      flex: 1;
    }

    .today-wins-stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .today-wins-stat-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      margin-top: 3px;
    }

    /* ── Project ── */
    .today-wins-project {
      font-size: 10px;
      color: var(--muted-2);
      margin-bottom: 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Encouragement ── */
    .today-wins-encouragement {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 12px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
      text-align: center;
    }

    /* ── Today's Story ── */
    .today-story-section {
      margin-bottom: 12px;
    }

    .today-story-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .today-story-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .today-story-entry {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 10px;
      background: var(--bg-card);
      border-radius: 6px;
      border: 1px solid var(--border);
      border-left: 2px solid var(--green-border);
    }

    .today-story-entry-icon {
      font-size: 13px;
      flex-shrink: 0;
      line-height: 1;
    }

    .today-story-entry-text {
      min-width: 0;
      flex: 1;
    }

    .today-story-entry-headline {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .today-story-entry-detail {
      font-size: 9px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    /* ── Auto-close row ── */
    .auto-close-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 10px;
    }

    .auto-close-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      color: var(--muted-2);
      font-weight: 500;
      transition: color 0.15s;
    }

    .auto-close-label:hover {
      color: var(--muted);
    }

    .auto-close-label input[type="checkbox"] {
      accent-color: var(--green);
      cursor: pointer;
      width: 11px;
      height: 11px;
    }

    .auto-close-sep {
      color: var(--border);
    }

    .auto-close-countdown {
      color: var(--green);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      min-width: 24px;
      text-align: left;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .auto-close-countdown.visible {
      opacity: 1;
    }

    /* ── Buttons ── */
    .today-wins-buttons {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .today-wins-buttons button {
      padding: 7px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      transition: background 0.15s, color 0.15s, border-color 0.15s, opacity 0.15s;
    }

    .today-wins-btn-done {
      background: var(--green);
      color: #071d07;
      border-color: transparent;
    }

    .today-wins-btn-done:hover {
      opacity: 0.88;
    }

    .today-wins-btn-copy {
      background: rgba(96, 165, 250, 0.08);
      color: #60a5fa;
      border-color: rgba(96, 165, 250, 0.25);
    }

    .today-wins-btn-copy:hover {
      background: rgba(96, 165, 250, 0.14);
    }

    .today-wins-btn-copy.copied {
      background: var(--green-dim);
      color: var(--green);
      border-color: var(--green-border);
    }

    .today-wins-btn-continue {
      background: rgba(127,127,127,0.07);
      color: var(--muted);
      border-color: var(--border);
    }

    .today-wins-btn-continue:hover {
      background: rgba(127,127,127,0.12);
      color: var(--text-2);
    }
  </style>
</head>
<body>
  <div class="wins-wrap">
    <div class="wins-header">
      <div class="wins-title" id="today-wins-title">Today's Wins</div>
      <div id="today-wins-message" class="today-wins-message"></div>
    </div>

    <div class="today-wins-stats">
      <div class="today-wins-stat">
        <span class="today-wins-stat-value" id="today-wins-time">0m</span>
        <span class="today-wins-stat-label">coding</span>
      </div>
      <div class="today-wins-stat">
        <span class="today-wins-stat-value" id="today-wins-files">0</span>
        <span class="today-wins-stat-label">files</span>
      </div>
      <div class="today-wins-stat">
        <span class="today-wins-stat-value" id="today-wins-streak">0</span>
        <span class="today-wins-stat-label">day streak</span>
      </div>
    </div>

    <div id="today-wins-project" class="today-wins-project"></div>
    <div id="today-wins-encouragement" class="today-wins-encouragement"></div>

    <div id="today-story-section" class="today-story-section" style="display:none">
      <div class="today-story-label">Today's Story</div>
      <ul id="today-story-list" class="today-story-list"></ul>
    </div>

    <div class="auto-close-row">
      <label class="auto-close-label" for="auto-close-checkbox">
        <input type="checkbox" id="auto-close-checkbox">
        <span>Auto-close</span>
      </label>
      <span class="auto-close-sep">·</span>
      <span class="auto-close-countdown" id="auto-close-countdown"></span>
    </div>

    <div class="today-wins-buttons">
      <button id="today-wins-done" class="today-wins-btn-done">See you tomorrow!</button>
      <button id="today-wins-copy" class="today-wins-btn-copy">Copy</button>
      <button id="today-wins-continue" class="today-wins-btn-continue">Keep going!</button>
    </div>
  </div>

  <script type="module" src="today-wins-page.js"></script>
</body>
</html>
